plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'maven-publish'
}

android {
    compileSdk = 36
    namespace = 'ch.sbb.maps'

    defaultConfig {
        minSdk = 24
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}
kotlin {
    explicitApi()
}
ext {
    versions = [
            material         : '1.14.0',
            navigation       : '2.9.0',
            composeBom       : '2024.10.01',
            maplibre         : '13.3.0',
            junit            : '4.13.2',
            androidXTestJunit: '1.3.0',
            espressoCore     : '3.7.0'
    ]
}
dependencies {
    // https://mvnrepository.com/artifact/com.google.android.material/material
    implementation "com.google.android.material:material:${versions.material}"

    // https://mvnrepository.com/artifact/androidx.navigation/navigation-compose
    implementation "androidx.navigation:navigation-compose:${versions.navigation}"

    // Compose
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    /// Allowing client access
    // https://mvnrepository.com/artifact/androidx.compose/compose-bom
    // https://developer.android.com/develop/ui/compose/bom/bom-mapping
    api platform("androidx.compose:compose-bom:${versions.composeBom}")
    api "androidx.compose.runtime:runtime-livedata"
    api "androidx.compose.material3:material3"

    // https://mvnrepository.com/artifact/org.maplibre.gl/android-sdk
    api "org.maplibre.gl:android-sdk:${versions.maplibre}"

    // Test dependencies
    testImplementation "junit:junit:${versions.junit}"
    androidTestImplementation "androidx.test.ext:junit:${versions.androidXTestJunit}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${versions.espressoCore}"
    androidTestImplementation platform("androidx.compose:compose-bom:${versions.composeBom}")
    debugImplementation 'androidx.compose.ui:ui-tooling'
}