name: Map SDK Build and Release

# Manual release. Normal merges to main do NOT release anything.
# To release: Actions -> this workflow -> "Run workflow" -> type the version.
# It sets that version, builds + signs, and UPLOADS to the Maven Central
# Portal (stage: UPLOAD in jreleaser.yml) where it stays PENDING. Publishing
# is done manually in the Central Portal (central.sonatype.com).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # App-bakery token so the version-bump commit/tag can be pushed to main
      # (the default GITHUB_TOKEN can't push to a protected branch).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APPBAKERYGITHUBAPP_APPID }}
          private-key: ${{ secrets.APPBAKERYGITHUBAPP_PRIVATEKEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate and set version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          # must look like X.Y.Z (optionally -suffix, e.g. 2.0.0 or 2.0.0-RC1)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected like 2.0.0)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${VERSION}"

      - name: Update gradle.properties
        run: sed -i "s/^PUBLISH_VERSION=.*/PUBLISH_VERSION=${{ steps.version.outputs.version }}/" gradle.properties

      - name: Stage SDK artifacts
        run: ./gradlew :journey-maps-client-android:publishReleasePublicationToPreDeployRepository

      # Signs + uploads to the Central Portal. UPLOAD-only (jreleaser.yml),
      # so the deployment stays PENDING and is NOT auto-published.
      - name: Sign and upload to Maven Central
        uses: jreleaser/release-action@v2
        with:
          version: 1.27.0
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload JReleaser logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: out/jreleaser/
          retention-days: 3

      # Only runs if the upload above succeeded: tag the release and commit
      # the bumped version back to main so the next release starts from it.
      - name: Tag and commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: release ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"
