name: Map SDK Build and Release

# SDK release to Maven Central (manual).
#
# How to release:
#   1. Actions -> "Map SDK Build and Release" -> Run workflow
#   2. Pick the bump: patch / minor / major
#   3. This builds, signs, and uploads the new version to the Central Portal.
#      It stays PENDING there (not public yet).
#   4. Go to central.sonatype.com -> Deployments -> click Publish to make it public.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (compared to the last release)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Run one release at a time so parallel runs don't clash on the same version.
    concurrency:
      group: map-sdk-release-main
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute new version
        id: version
        run: |
          CURRENT=$(grep '^PUBLISH_VERSION=' gradle.properties | cut -d'=' -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${CURRENT} -> ${NEW} (${{ inputs.bump }})"

      - name: Update gradle.properties
        run: sed -i "s/^PUBLISH_VERSION=.*/PUBLISH_VERSION=${{ steps.version.outputs.version }}/" gradle.properties

      - name: Stage SDK artifacts
        run: ./gradlew :journey-maps-client-android:publishReleasePublicationToPreDeployRepository

      - name: Sign and upload to Maven Central
        uses: jreleaser/release-action@v2
        with:
          version: 1.27.0
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JReleaser logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: out/jreleaser/
          retention-days: 3

      # The upload already happened above. Only if it succeeded, record the
      # release: tag it and commit the new version to main (base for next).
      - name: Tag and commit the released version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: release ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"
