name: SDK Release Test (branch, dry-run)

# TEMPORARY test workflow. Runs on every push to the test branch so we can
# verify the Maven Central release path from a branch (no PR merge needed).
# Uploads to the Central Portal in UPLOAD-only mode (stage: UPLOAD) — the
# deployment validates and stays PENDING; it is never auto-published.
# Delete this file once the real release workflow is validated.
on:
  push:
    branches:
      - ci/maven-central-release

permissions:
  contents: read

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: v
        run: echo "version=$(grep '^PUBLISH_VERSION=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Stage SDK artifacts
        run: ./gradlew :journey-maps-client-android:publishReleasePublicationToPreDeployRepository

      # Real upload to the Central Portal, but UPLOAD-only (stage: UPLOAD in
      # jreleaser.yml) so it validates and stays PENDING — never auto-published.
      - name: JReleaser deploy (UPLOAD only — validates, not published)
        uses: jreleaser/release-action@v2
        with:
          version: 1.27.0
          arguments: deploy
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.v.outputs.version }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: out/jreleaser/
          retention-days: 3
